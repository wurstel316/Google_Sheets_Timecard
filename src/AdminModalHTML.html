<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Timeline View</title>
  <style>
    :root {
      --text-xs: clamp(0.76rem, 2.3vw, 0.86rem);
      --text-sm: clamp(0.86rem, 2.8vw, 0.96rem);
      --text-md: clamp(0.96rem, 3.2vw, 1.08rem);
      --control-sm: 2.1rem;
      --control-md: 2.7rem;
      --bg: #243242;
      --panel: #2d3a4b;
      --panel-2: #253243;
      --line: #435672;
      --line-soft: #3b4b63;
      --ink: #e4edf8;
      --muted: #adc0d7;
      --accent: #72baff;
      --ok: #70dfac;
      --bad: #ff879c;
      --warn: #ffd589;
      --radius: 12px;
    }

    [data-theme="light"] {
      --bg: #eef3f9;
      --panel: #ffffff;
      --panel-2: #f4f8fd;
      --line: #bfd2e8;
      --line-soft: #c7d8eb;
      --ink: #143558;
      --muted: #486381;
      --accent: #1169b3;
      --ok: #1f8454;
      --bad: #b33a53;
      --warn: #976700;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: transparent;
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      padding: 0;
    }

    .admin-shell {
      max-width: none;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: var(--panel);
      box-shadow: none;
      overflow: hidden;
      min-height: 100vh;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .head {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--panel-2);
    }

    .head-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.12rem, 3.4vw, 1.48rem);
      color: var(--accent);
      letter-spacing: 0.01em;
    }

    .sub {
      color: var(--muted);
      font-size: var(--text-xs);
      font-weight: 600;
      margin-left: 4px;
    }

    .toolbar {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 1px;
    }

    .btn {
      border: 1px solid #73b4fb;
      background: #67aff8;
      color: #0a2b51;
      border-radius: 8px;
      padding: 0.5rem 0.65rem;
      font-size: var(--text-sm);
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      flex: 0 0 auto;
      cursor: pointer;
      min-height: var(--control-md);
    }

    .btn.secondary {
      background: #5a95d2;
      border-color: #72aeea;
      color: #eaf4ff;
    }

    .btn.alt {
      background: #2a3f5a;
      color: #e2edff;
      border-color: #506b8e;
    }

    .switches {
      margin-top: 7px;
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 1px;
    }

    .active-period-banner {
      margin-top: 7px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 78%, var(--accent) 22%);
      color: var(--ink);
      border-radius: 9px;
      padding: 0.45rem 0.65rem;
      font-size: var(--text-sm);
      font-weight: 700;
      line-height: 1.25;
      display: none;
    }

    .active-period-banner.visible {
      display: block;
    }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0;
      cursor: pointer;
      user-select: none;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .switch-track {
      position: relative;
      width: 2rem;
      height: 1.1rem;
      border-radius: 999px;
      background: #4b5563;
      transition: background 0.2s ease;
      flex: 0 0 auto;
    }

    .switch-track::after {
      content: '';
      position: absolute;
      top: 0.13rem;
      left: 0.13rem;
      width: 0.84rem;
      height: 0.84rem;
      border-radius: 50%;
      background: #e7ecf3;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease;
    }

    .switch-label {
      font-size: var(--text-xs);
      font-weight: 600;
      color: #9fb0c9;
      white-space: nowrap;
    }

    .switch input:checked + .switch-track {
      background: #22c55e;
    }

    .switch input:checked + .switch-track::after {
      transform: translateX(0.9rem);
    }

    .switch input:checked ~ .switch-label {
      color: #8de9b6;
    }

    .msg {
      margin-top: 6px;
      font-size: var(--text-sm);
      color: var(--muted);
      min-height: 1rem;
    }

    .content {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      overflow: auto;
      padding: 0 8px 8px;
      background: var(--panel-2);
    }

    .employee {
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      overflow: visible;
      margin-bottom: 10px;
      background: #273447;
    }

    .employee-head {
      background: #c8ced8;
      color: #223246;
      border-bottom: 1px solid #a9b5c6;
      padding: 7px 8px;
      font-size: 1rem;
      font-weight: 700;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 6;
      box-shadow: inset 0 -1px 0 #a9b5c6;
    }

    .employee-label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 0;
    }

    .collapse-btn {
      width: 1.2rem;
      height: 1.2rem;
      min-width: 1.2rem;
      border: 1px solid #41526a;
      border-radius: 0.2rem;
      background: #24344b;
      color: #e9f3ff;
      font-weight: 700;
      font-size: 0.8rem;
      line-height: 1;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .sync-pill {
      border-radius: 999px;
      border: 1px solid;
      padding: 5px 9px;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .sync-pill.ok { color: var(--ok); border-color: rgba(112,223,172,0.6); background: rgba(112,223,172,0.16); }
    .sync-pill.bad { color: var(--bad); border-color: rgba(255,135,156,0.6); background: rgba(255,135,156,0.16); }
    .sync-pill.warn { color: var(--warn); border-color: rgba(255,213,137,0.6); background: rgba(255,213,137,0.16); }

    .day { border-bottom: 1px solid #45556f; }
    .day:last-child { border-bottom: none; }

    .day-head {
      background: #aec3df;
      color: #16375e;
      border-bottom: 1px solid #7f9fc6;
      padding: 6px 8px;
      font-size: 1rem;
      font-weight: 700;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .day-actions { display: inline-flex; gap: 8px; align-items: center; }

    .day-verify-btn {
      border: 1px solid #4f6887;
      background: #254161;
      color: #d8e8fb;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .day-verify-btn.on { border-color: rgba(112,223,172,0.6); background: rgba(112,223,172,0.16); color: var(--ok); }

    .day-total {
      font-size: 0.88rem;
      border: 1px solid #6b85a5;
      border-radius: 999px;
      padding: 3px 8px;
      background: rgba(24,59,94,0.14);
      color: #16375e;
    }

    .add-missed {
      border: 1px solid #42658f;
      background: #2a4e7c;
      color: #e0edff;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .day-body { padding: 8px; display: grid; gap: 8px; background: #2b3545; }

    .timeline {
      border: 1px solid #4d6384;
      border-radius: 9px;
      background: #16253a;
      padding: 6px 7px 12px;
      position: relative;
    }

    .ticks {
      position: relative;
      height: 12px;
      color: #99afca;
      font-size: 0.68rem;
      margin-bottom: 5px;
    }

    .tick { position: absolute; top: 0; transform: translateX(-50%); }
    .tick.start { transform: none; left: 0; }
    .tick.end { transform: translateX(-100%); }

    .track-grid {
      position: relative;
      height: 70px;
      border-radius: 7px;
      background-image: linear-gradient(to right, rgba(114,146,181,0.16) 1px, transparent 1px);
      background-size: calc(100% / 24) 100%;
      background-color: #1f3048;
      overflow: visible;
    }

    .expected {
      position: absolute;
      top: 6px;
      height: 12px;
      border-radius: 999px;
      background: rgba(90,178,130,0.2);
      border: 1px solid rgba(90,178,130,0.6);
    }

    /* Segment type colors - light mode */
    [data-theme="light"] .expected.duty {
      background: rgba(234, 247, 239, 0.6);
      border: 1px solid rgba(191, 226, 205, 0.8);
    }
    [data-theme="light"] .expected.backup {
      background: rgba(241, 237, 255, 0.6);
      border: 1px solid rgba(215, 204, 255, 0.8);
    }
    [data-theme="light"] .expected.lunch {
      background: rgba(255, 247, 223, 0.6);
      border: 1px solid rgba(242, 210, 122, 0.8);
    }

    /* Segment type colors - dark mode */
    [data-theme="dark"] .expected.duty {
      background: rgba(31, 58, 45, 0.5);
      border: 1px solid rgba(53, 110, 79, 0.8);
    }
    [data-theme="dark"] .expected.backup {
      background: rgba(42, 37, 64, 0.5);
      border: 1px solid rgba(87, 75, 134, 0.8);
    }
    [data-theme="dark"] .expected.lunch {
      background: rgba(58, 47, 26, 0.5);
      border: 1px solid rgba(125, 101, 64, 0.8);
    }

    .dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      transform: translateX(-50%);
      border: 2px solid #fff;
      background: #6db7ff;
      box-shadow: 0 0 0 2px rgba(109,183,255,0.26);
      cursor: pointer;
    }

    .dot.out { background: #8cc4ff; }
    .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(255,135,156,0.25); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(255,213,137,0.28); }
    .dot.pending { opacity: 0.55; cursor: wait; }

    .dot::after {
      content: attr(data-label);
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.62rem;
      color: #d5e4f7;
      white-space: nowrap;
    }

    .dot-line {
      position: absolute;
      height: 1px;
      background: rgba(171,199,232,0.55);
      transform: translateY(-50%);
    }

    .dot-line.warn-row { background: rgba(255,213,137,0.78); }
    .dot-line.deleted-row { background: rgba(255, 132, 148, 0.5); }

    .rows-list { display: grid; gap: 6px; }

    .notes-group {
      border: 1px solid #4d6486;
      background: #1a283c;
      border-radius: 8px;
      padding: 8px;
      display: grid;
      gap: 8px;
    }

    .note-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 8px;
    }

    .day-note-item {
      border: 1px solid #4b5f7f;
      border-radius: 8px;
      background: #24354d;
      padding: 7px 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .day-note-item.composer {
      border-style: dashed;
      background: #29425f;
    }

    .row-actions { display: inline-flex; gap: 0.35rem; align-items: center; }

    .day-note-line {
      line-height: 1.25;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #d6e3f4;
      min-width: 0;
    }

    .day-note-line.empty {
      color: #9db2cb;
      font-style: italic;
    }

    .day-note-line.long {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }

    .inline-note-input {
      width: 100%;
      border: 1px solid #607b9e;
      border-radius: 7px;
      background: #20354d;
      color: #deebfc;
      font: inherit;
      font-size: 0.82rem;
      line-height: 1.25;
      padding: 6px 8px;
      min-height: 36px;
      resize: vertical;
    }

    .inline-note-input::placeholder {
      color: #9fb4d0;
    }

    .inline-note-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .inline-note-btn {
      border: 1px solid #6999b5;
      background: #355b72;
      color: #ebf9ff;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1.1;
    }

    .admin-note-add-btn {
      margin-top: 0;
      width: 1.65rem;
      min-width: 1.65rem;
      height: 1.65rem;
      min-height: 1.65rem;
      border-radius: 999px;
      background: #2f5868;
      color: #dff4ff;
      border: 1px solid #5687a0;
      font-weight: 700;
      font-size: 0.92rem;
      line-height: 1;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
    }

    .admin-note-add-btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .day-verify-btn[disabled],
    .add-missed[disabled] {
      opacity: 0.62;
      cursor: not-allowed;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 20, 0.56);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 10px;
      z-index: 20;
    }
    .overlay.open { display: flex; }

    .modal-card {
      width: min(96vw, 620px);
      max-height: 92vh;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #1f2a3b;
      color: #dce8fa;
      box-shadow: 0 20px 35px rgba(0,0,0,0.45);
      position: relative;
      padding: 12px;
    }

    .modal-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border: 1px solid #6787ac;
      background: #30455f;
      color: #eaf3ff;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 700;
    }

    .field { display: grid; gap: 4px; margin-bottom: 8px; font-size: 0.84rem; }

    .range-note {
      margin: 2px 0 8px;
      padding: 6px 8px;
      border: 1px solid #4d6486;
      border-radius: 8px;
      background: #1a283c;
      color: #c9daef;
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .field-input-with-trigger {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: center;
    }

    .field-calendar-trigger {
      width: 2.15rem;
      min-width: 2.15rem;
      height: 2.15rem;
      border: 1px solid #4f6587;
      background: #20324a;
      color: #dbe9fb;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .field-calendar-trigger:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .manual-datetime-input::-webkit-calendar-picker-indicator,
    .edit-datetime-input::-webkit-calendar-picker-indicator {
      opacity: 0;
      pointer-events: none;
      width: 0;
    }

    input[type="text"], input[type="datetime-local"], textarea, select {
      width: 100%;
      border: 1px solid #4f6587;
      background: #151f2f;
      color: #e5efff;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.9rem;
    }

    .modal-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

    .edit-hold-action-btn {
      position: relative;
      overflow: visible;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      --edit-hold-size: 1.65rem;
      --edit-hold-ring-circumference: 270.2;
      width: var(--edit-hold-size) !important;
      min-width: var(--edit-hold-size);
      height: var(--edit-hold-size);
      min-height: var(--edit-hold-size);
      padding: 0 !important;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
    }

    .edit-hold-action-btn.edit-delete-btn {
      background: #f87171;
      color: #0f1419;
      border: 1px solid #b93b3b;
    }

    .edit-hold-action-btn.edit-restore-btn {
      background: #4ade80;
      color: #0f1419;
      border: 1px solid #2f6b49;
    }

    [data-theme="light"] .edit-hold-action-btn.edit-delete-btn {
      background: #c62828;
      color: #ffffff;
      border-color: #8e0000;
    }

    [data-theme="light"] .edit-hold-action-btn.edit-restore-btn {
      background: #388e3c;
      color: #ffffff;
      border-color: #1f5f2b;
    }

    .edit-hold-asset {
      position: relative;
      width: var(--edit-hold-size);
      height: var(--edit-hold-size);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      overflow: hidden;
    }

    .edit-hold-ring {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.28));
    }

    .edit-hold-ring circle {
      fill: none;
    }

    .edit-hold-ring .track {
      stroke: rgba(255, 255, 255, 0.24);
      stroke-width: 14;
    }

    .edit-hold-ring .progress {
      stroke: rgba(255, 255, 255, 0.98);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: var(--edit-hold-ring-circumference);
      stroke-dashoffset: var(--edit-hold-ring-circumference);
    }

    .edit-hold-action-btn .edit-action-icon {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--edit-hold-size) * 0.56);
      line-height: 1;
    }

    .edit-hold-action-btn.is-holding .edit-hold-ring {
      opacity: 1;
    }

    .edit-hold-action-btn.is-holding .edit-hold-ring .progress {
      animation: editHoldCountdownFill 3s linear 1 forwards;
    }

    @keyframes editHoldCountdownFill {
      from { stroke-dashoffset: var(--edit-hold-ring-circumference); }
      to { stroke-dashoffset: 0; }
    }
    .edit-note-list { margin-top: 8px; border: 1px solid #4d6486; background: #1a283c; border-radius: 8px; padding: 8px; display: grid; gap: 6px; max-height: 180px; overflow: auto; }
    .edit-note-item { border: 1px dashed #5b6f8d; border-radius: 8px; background: #24354d; padding: 6px 8px; font-size: 0.8rem; color: #d6e3f4; }
    .edit-note-empty { color: #9db2cb; font-size: 0.8rem; }

    @media (max-width: 768px) {
      .day-head { grid-template-columns: 1fr; }
      .note-grid { grid-template-columns: 1fr; }
      .day-note-item { grid-template-columns: 1fr auto; }
      .head {
        padding: 0.6rem;
      }
      .toolbar,
      .switches {
        gap: 0.45rem;
      }
    }
  </style>
</head>
<body>
  <section class="admin-shell" id="adminRoot">
    <header class="head">
      <div class="head-top">
        <h1>Admin View <span class="sub" id="periodLabel"></span></h1>
        <div class="row-actions">
          <button class="btn alt" id="modeBtn" type="button">Switch to Legacy</button>
        </div>
      </div>

      <div class="toolbar">
        <button class="btn" id="btnRefresh">Refresh Entries</button>
        <button class="btn" id="btnPayroll">Create Payroll Report</button>
        <button class="btn secondary" id="btnSchedule">Schedule Tool</button>
        <button class="btn secondary" id="btnReports">More Reports</button>
      </div>

      <div class="switches">
        <label class="switch"><input id="showRaw" type="checkbox"><span class="switch-track"></span><span class="switch-label">Show raw times</span></label>
        <label class="switch"><input id="showDeleted" type="checkbox"><span class="switch-track"></span><span class="switch-label">Show deleted rows</span></label>
        <label class="switch"><input id="showActiveOnly" type="checkbox" checked><span class="switch-track"></span><span class="switch-label">Show only active pay period</span></label>
        <label class="switch"><input id="autoCollapse" type="checkbox"><span class="switch-track"></span><span class="switch-label">Auto-collapse verified days</span></label>
      </div>

      <div class="active-period-banner" id="activePayPeriodBanner"></div>

      <div class="msg" id="adminLoadMsg">Loading entries...</div>
    </header>

    <div class="content" id="timelineBoard"></div>

  </section>

  <div class="overlay" id="manualEntryModal">

              <circle class="track" cx="50" cy="50" r="43"></circle>
              <circle class="progress" cx="50" cy="50" r="43"></circle>

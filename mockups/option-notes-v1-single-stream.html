<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes Containment V1 - Single Stream</title>
  <style>
    :root {
      --bg: #1b2738;
      --panel: #24344b;
      --panel-2: #2c3f59;
      --line: #4a6283;
      --ink: #dce9fb;
      --muted: #9fb2cf;
      --accent: #79b4ff;
      --add-bg: #2f5868;
      --add-border: #5f90ad;
      --add-ink: #e6f6ff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1000px 500px at 10% -10%, #2b4061 0%, transparent 60%), var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
    }

    .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 14px; }

    .head {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    h1 { margin: 0; font-size: 1.2rem; color: var(--accent); }
    .sub { margin: 5px 0 0; color: var(--muted); font-size: 0.92rem; }

    .notes-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .note-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .note-pill {
      border: 1px solid #536f93;
      background: var(--panel-2);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.86rem;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .add-btn {
      width: 1.65rem;
      height: 1.65rem;
      border-radius: 999px;
      border: 1px solid var(--add-border);
      background: var(--add-bg);
      color: var(--add-ink);
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .foot {
      color: var(--muted);
      font-size: 0.82rem;
      padding-left: 2px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="head">
      <h1>V1: Single Stream</h1>
      <p class="sub">One large notes box for the day. Every note line gets one plus action.</p>
    </section>

    <section class="notes-box" aria-label="Day notes stream">
      <div class="note-row"><div class="note-pill">Verified by sam at 13:30 09/01/2026</div><button class="add-btn" type="button">+</button></div>
      <div class="note-row"><div class="note-pill">Time edited by sam at 16:43 09/01/2026</div><button class="add-btn" type="button">+</button></div>
      <div class="note-row"><div class="note-pill">Customer changed lunch timing due to field call.</div><button class="add-btn" type="button">+</button></div>
      <div class="note-row"><div class="note-pill">No notes</div><button class="add-btn" type="button">+</button></div>
    </section>

    <div class="foot">Density profile: safest and most scannable, lowest visual complexity.</div>
  </main>
</body>
</html>
